services:
  btc-3d-anima:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btc-3d-anima
    restart: unless-stopped
    ports:
      # Port 3857 pada host dipetakan ke port 80 pada kontainer Nginx
      # Siap untuk reverse proxy (Nginx Proxy Manager, Caddy, Traefik, Cloudflare Tunnel)
      - "${PORT:-3857}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Bergabung ke network reverse-proxy host agar kontainer nginx (pdf-utility-proxy)
    # dapat melayani https://btc.farzani.my.id lewat DNS name: http://btc-3d-anima:80
    networks:
      - default
      - pdf-internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production

networks:
  # Network internal milik reverse proxy lain di host yang sama (dibuat sebelumnya).
  # Ditandai external agar compose tidak memutus/membuat ulang network yang sedang dipakai.
  pdf-internal:
    external: true
    name: pdf-utility_pdf-internal
