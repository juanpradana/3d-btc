server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # MIME Types: Pastikan .wasm disajikan sebagai application/wasm
    # ------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # ------------------------------------------------------------------------
    # Gzip Compression: Hemat bandwidth untuk WASM, JS, CSS, JSON, SVG
    # ------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/wasm
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------------------------------------------------------------------------
    # Security Headers & Content Security Policy (CSP)
    # Catatan: wss://*.binance.vision & https://*.binance.vision diizinkan
    #          agar browser bisa streaming market data real-time langsung.
    # ------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.binance.vision wss://*.binance.vision https://*.binance.com:* wss://*.binance.com:* wss://stream.binance.com:9443; worker-src 'self' blob:;" always;

    # ------------------------------------------------------------------------
    # 1. Asset Hashed (/assets/*): Cache 1 tahun immutable (Vite content hash)
    # ------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # 2. Asset Publik Statis (favicon, icons, dsb)
    # ------------------------------------------------------------------------
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # 3. index.html: Jangan di-cache agar rilis baru langsung terbaca klien
    # ------------------------------------------------------------------------
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.binance.vision wss://*.binance.vision https://*.binance.com:* wss://*.binance.com:* wss://stream.binance.com:9443; worker-src 'self' blob:;" always;
    }

    # ------------------------------------------------------------------------
    # 4. SPA Fallback: Arahkan route tak dikenal ke index.html
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
